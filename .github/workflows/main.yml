name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Organize Project Structure
      run: |
        # 1. መዋቅሩን በአግባቡ ማደራጀት
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/example/cbeapp

        # 2. ፋይሎችን ወደ ቦታቸው መውሰድ (root ውስጥ ካሉት)
        mv *.java app/src/main/java/com/example/cbeapp/ 2>/dev/null || true
        mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv *.html app/src/main/assets/ 2>/dev/null || true
        mv *.css app/src/main/assets/ 2>/dev/null || true
        mv *.png app/src/main/assets/ 2>/dev/null || true

        # 3. የ Gradle ፋይሎችን ማስተካከል
        cat << 'EOF' > build.gradle
        // Top-level build file
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "CBE App"
        include ':app'
        EOF

        # 4. app/build.gradle መፍጠር
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.example.cbeapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.cbeapp"
                minSdk 21
                targetSdk 34
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Build Debug APK
      run: |
        # Gradle-ን መጫን እና መገንባት
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CBE-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
