name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Structure & Code
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/example/cbeapp

        # የዌብ ፋይሎችን ወደ assets ማዛወር
        mv *.html app/src/main/assets/ 2>/dev/null || true
        mv *.css app/src/main/assets/ 2>/dev/null || true
        mv *.js app/src/main/assets/ 2>/dev/null || true
        mv *.json app/src/main/assets/ 2>/dev/null || true
        mv *.png app/src/main/assets/ 2>/dev/null || true

        # build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "CBE App"
        include ':app'
        EOF

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.example.cbeapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.cbeapp"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # AndroidManifest.xml (ከ System Intent እና Permissions ጋር)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECEIVE_SMS" />
            <uses-permission android:name="android.permission.READ_SMS" />
            <uses-permission android:name="android.permission.SEND_SMS" />

            <application
                android:allowBackup="true"
                android:label="CBE App"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity.java (Javascript Interface ለ System SMS Intent ያካተተ)
        cat << 'EOF' > app/src/main/java/com/example/cbeapp/MainActivity.java
        package com.example.cbeapp;

        import android.content.Context;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Bundle;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            public class WebAppInterface {
                Context mContext;

                WebAppInterface(Context c) {
                    mContext = c;
                }

                @JavascriptInterface
                public void sendSmsIntent(String phoneNumber, String message) {
                    Intent intent = new Intent(Intent.ACTION_VIEW);
                    intent.setData(Uri.parse("sms:" + phoneNumber));
                    intent.putExtra("sms_body", message);
                    mContext.startActivity(intent);
                }
            }

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);

                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);

                webView.addJavascriptInterface(new WebAppInterface(this), "Android");
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CBE-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
