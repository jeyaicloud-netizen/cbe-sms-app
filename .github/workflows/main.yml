name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Structure
      run: |
        # አስፈላጊ የሆኑትን ማውጫዎች ይፍጠሩ
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/example/cbeapp

        # ፋይሎችን ወደ ቦታቸው ይውሰዱ
        mv *.html app/src/main/assets/ 2>/dev/null || true
        mv *.css app/src/main/assets/ 2>/dev/null || true
        mv *.png app/src/main/assets/ 2>/dev/null || true

        # build.gradle ፋይል
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # settings.gradle ፋይል
        cat << 'EOF' > settings.gradle
        rootProject.name = "CBE App"
        include ':app'
        EOF

        # app/build.gradle ፋይል
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.example.cbeapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.cbeapp"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug --no-daemon

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CBE-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
